<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osama TV | أسامة تي في</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #080e1e;
      --bg-card: #121d38;
      --accent-blue: #00b4d8;
      --glow-blue: rgba(0, 180, 216, 0.4);
      --text-main: #ffffff;
      --text-sub: #90e0ef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding-bottom: 60px;
    }

    /* Navbar */
    header {
      background: rgba(10, 25, 47, 0.95);
      backdrop-filter: blur(10px);
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0, 180, 216, 0.2);
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span { color: var(--accent-blue); }

    .search-box {
      position: relative;
      width: 50%;
      max-width: 300px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 180, 216, 0.3);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      outline: none;
    }

    /* Main Container */
    .container { padding: 1rem 1.5rem; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1.8rem 0 1rem 0;
      font-size: 1.2rem;
      color: var(--text-sub);
      border-right: 4px solid var(--accent-blue);
      padding-right: 10px;
    }

    /* Horizontal Slider */
    .horizontal-scroll {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 10px;
      scroll-behavior: smooth;
    }

    .horizontal-scroll::-webkit-scrollbar { height: 5px; }
    .horizontal-scroll::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 10px; }

    /* Cards */
    .card {
      min-width: 140px;
      max-width: 140px;
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 5px 15px var(--glow-blue);
      border-color: var(--accent-blue);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-title {
      padding: 8px;
      font-size: 0.85rem;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }

    .badge {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffd166;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Player Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--bg-card);
      width: 95%;
      max-width: 850px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--accent-blue);
    }

    .modal-header {
      padding: 12px;
      background: #0077b6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-box {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .player-box iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fa-solid fa-play"></i> Osama<span>TV</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث..." onkeyup="searchContent()">
    </div>
  </header>

  <div class="container" id="mainContainer">
    
    <div class="section-header"><i class="fa-solid fa-fire"></i> أحدث الأفلام</div>
    <div class="horizontal-scroll" id="trending-movies"></div>

    <div class="section-header"><i class="fa-solid fa-tv"></i> المسلسلات الشائعة</div>
    <div class="horizontal-scroll" id="trending-series"></div>

    <div class="section-header"><i class="fa-solid fa-star"></i> الأعلى تقييماً</div>
    <div class="horizontal-scroll" id="top-rated"></div>

  </div>

  <!-- Player Modal -->
  <div class="modal" id="playerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h4 id="videoTitle">مشاهدة</h4>
        <i class="fa-solid fa-xmark" onclick="closePlayer()" style="cursor:pointer; font-size: 1.2rem;"></i>
      </div>
      <div class="player-box">
        <iframe id="videoIframe" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    let dbData = {};

    async function loadData() {
      try {
        const response = await fetch('./data.json?v=' + new Date().getTime());
        dbData = await response.json();
        
        renderRow('trending-movies', dbData.trending_movies, 'movie');
        renderRow('trending-series', dbData.trending_series, 'tv');
        renderRow('top-rated', dbData.top_rated, 'movie');
      } catch (e) {
        console.error("Error loading JSON", e);
      }
    }

    function renderRow(elementId, items, type) {
      const container = document.getElementById(elementId);
      if (!items || items.length === 0) {
        container.innerHTML = '<p style="padding:10px; font-size:0.8rem;">جاري جلب البيانات...</p>';
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="card" onclick="playMedia('${item.id}', '${item.title ? 'movie' : 'tv'}', '${(item.title || item.name).replace(/'/g, "\\'")}')">
          <span class="badge"><i class="fa-solid fa-star"></i> ${item.vote_average ? item.vote_average.toFixed(1) : ''}</span>
          <img src="https://image.tmdb.org/t/p/w300${item.poster_path}" alt="poster">
          <div class="card-title">${item.title || item.name}</div>
        </div>
      `).join('');
    }

    function playMedia(id, type, title) {
      document.getElementById('videoTitle').innerText = title;
      document.getElementById('videoIframe').src = `https://vidsrc.to/embed/${type}/${id}`;
      document.getElementById('playerModal').style.display = 'flex';
    }

    function closePlayer() {
      document.getElementById('playerModal').style.display = 'none';
      document.getElementById('videoIframe').src = '';
    }

    loadData();
  </script>
</body>
</html>
