<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osama TV | أسامة تي في - منصة الترفيه الشاملة</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #050914;
      --bg-card: #0d1527;
      --primary: #00b4d8;
      --accent: #7209b7;
      --text-main: #ffffff;
      --text-sub: #8d99ae;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding-bottom: 50px;
    }

    /* Navbar Header */
    header {
      background: rgba(5, 9, 20, 0.95);
      backdrop-filter: blur(10px);
      padding: 0.8rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0, 180, 216, 0.2);
    }

    .nav-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand span { color: var(--primary); }

    .search-box input {
      width: 140px;
      padding: 6px 10px;
      border-radius: 15px;
      border: 1px solid var(--primary);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.8rem;
      outline: none;
    }

    /* Category Navigation Menu */
    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 180, 216, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.3s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: #000;
      font-weight: bold;
    }

    /* Container */
    .container { padding: 1rem; }

    .section-title {
      font-size: 1.1rem;
      margin: 1.2rem 0 0.8rem 0;
      color: var(--primary);
      border-right: 3px solid var(--primary);
      padding-right: 8px;
    }

    /* Grid Display */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 0.8rem;
    }

    .card {
      background: var(--bg-card);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s;
    }

    .card:hover { transform: scale(1.03); border-color: var(--primary); }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card-title {
      padding: 6px;
      font-size: 0.75rem;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Ad Placeholder Banner */
    .ad-space {
      margin: 10px 0;
      padding: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(0, 180, 216, 0.3);
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-sub);
      border-radius: 6px;
    }

    /* Modal Player & Season Controls */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--bg-card);
      width: 95%;
      max-width: 800px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--primary);
    }

    .modal-header {
      padding: 10px;
      background: #0d1b2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      padding: 8px;
      background: #050914;
      justify-content: center;
    }

    .controls-bar select {
      background: var(--bg-card);
      color: #fff;
      border: 1px solid var(--primary);
      padding: 4px 8px;
      border-radius: 4px;
      outline: none;
    }

    .player-box {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .player-box iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-top">
      <div class="brand"><i class="fa-solid fa-play"></i> Osama<span>TV</span></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث..." onkeyup="searchContent()">
      </div>
    </div>

    <!-- شريط الأقسام -->
    <div class="categories-bar">
      <button class="cat-btn active" onclick="loadCategory('all')">الكل</button>
      <button class="cat-btn" onclick="loadCategory('movies')">أفلام</button>
      <button class="cat-btn" onclick="loadCategory('series')">مسلسلات</button>
      <button class="cat-btn" onclick="loadCategory('anime')">أنمي</button>
      <button class="cat-btn" onclick="loadCategory('action')">أكشن</button>
      <button class="cat-btn" onclick="loadCategory('horror')">رعب</button>
      <button class="cat-btn" onclick="loadCategory('comedy')">كوميدي</button>
      <button class="cat-btn" onclick="loadCategory('live')">📺 بث مباشر</button>
    </div>
  </header>

  <!-- مساحة إعلانية مستقبلية -->
  <div class="container">
    <div class="ad-space" id="adBanner">مساحة إعلانية مخصصة (يمكنك إضافة شفرة الإعلانات للربح مستقبلاً)</div>

    <div id="mainContent"></div>
  </div>

  <!-- المشغل واختيار الحلقات -->
  <div class="modal" id="playerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="videoTitle">المشاهدة</h5>
        <i class="fa-solid fa-xmark" onclick="closePlayer()" style="cursor:pointer;"></i>
      </div>

      <!-- خيارات الموسم والحلقة (تظهر فقط للمسلسلات) -->
      <div class="controls-bar" id="seriesControls" style="display:none;">
        <label>الموسم:</label>
        <select id="seasonSelect" onchange="updateEpisode()"></select>
        <label>الحلقة:</label>
        <select id="episodeSelect" onchange="updateEpisode()"></select>
      </div>

      <div class="player-box">
        <iframe id="videoIframe" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "c72257e5675c44f3e8f98033205d925d";
    const BASE_URL = "https://api.themoviedb.org/3";
    let currentMediaId = null; currentMediaType = null;

    // جلب الأقسام
    async function loadCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const container = document.getElementById('mainContent');
      container.innerHTML = "جاري التحميل...";

      if(cat === 'live') {
        renderLiveChannels();
        return;
      }

      let endpoint = "trending/all/week";
      if (cat === 'movies') endpoint = "discover/movie";
      if (cat === 'series') endpoint = "discover/tv";
      if (cat === 'anime') endpoint = "discover/tv?with_genres=16";
      if (cat === 'action') endpoint = "discover/movie?with_genres=28";
      if (cat === 'horror') endpoint = "discover/movie?with_genres=27";
      if (cat === 'comedy') endpoint = "discover/movie?with_genres=35";

      try {
        const res = await fetch(`${BASE_URL}/${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${API_KEY}&language=ar-SA`);
        const data = await res.json();
        renderGrid(data.results || []);
      } catch(e) {
        container.innerHTML = "حدث خطأ في تحميل البيانات.";
      }
    }

    function renderGrid(items) {
      const container = document.getElementById('mainContent');
      if (!items.length) { container.innerHTML = "لا توجد نتائج"; return; }

      container.innerHTML = `<div class="grid">` + items.map(item => {
        const type = item.title ? 'movie' : 'tv';
        const title = item.title || item.name;
        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w300${item.poster_path}` : 'https://via.placeholder.com/300x450';
        return `
          <div class="card" onclick="openPlayer('${item.id}', '${type}', '${title.replace(/'/g, "\\'")}')">
            <img src="${poster}" alt="${title}">
            <div class="card-title">${title}</div>
          </div>
        `;
      }).join('') + `</div>`;
    }

    // بث مباشر
    function renderLiveChannels() {
      const container = document.getElementById('mainContent');
      const channels = [
        { name: "BeIN Sports News", url: "https://www.youtube.com/embed/live_stream?channel=UC4i_9WvfPRTuRWEaSpA" },
        { name: "Al Jazeera Live", url: "https://www.youtube.com/embed/live_stream?channel=UCfiwzMa-11m685L36261f" }
      ];
      container.innerHTML = `
        <div class="section-title">قنوات البث المباشر</div>
        <div class="grid">
          ${channels.map(c => `
            <div class="card" onclick="playCustomUrl('${c.url}', '${c.name}')">
              <div style="height:120px; display:flex; align-items:center; justify-content:center; background:#121d38;"><i class="fa-solid fa-tv fa-2x" style="color:var(--primary)"></i></div>
              <div class="card-title">${c.name}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function openPlayer(id, type, title) {
      currentMediaId = id; currentMediaType = type;
      document.getElementById('videoTitle').innerText = title;
      const controls = document.getElementById('seriesControls');

      if (type === 'tv') {
        controls.style.display = 'flex';
        setupSeasons();
      } else {
        controls.style.display = 'none';
        document.getElementById('videoIframe').src = `https://vidsrc.pro/embed/movie/${id}`;
      }
      document.getElementById('playerModal').style.display = 'flex';
    }

    function setupSeasons() {
      const sSelect = document.getElementById('seasonSelect');
      const eSelect = document.getElementById('episodeSelect');
      sSelect.innerHTML = ''; eSelect.innerHTML = '';

      for(let i=1; i<=10; i++) sSelect.innerHTML += `<option value="${i}">موسم ${i}</option>`;
      for(let j=1; j<=24; j++) eSelect.innerHTML += `<option value="${j}">حلقة ${j}</option>`;
      
      updateEpisode();
    }

    function updateEpisode() {
      const s = document.getElementById('seasonSelect').value;
      const e = document.getElementById('episodeSelect').value;
      // سيرفر يمنع الإعلانات المنبثقة بقدر الإمكان ويعرض الحلقة المحددة
      document.getElementById('videoIframe').src = `https://vidsrc.pro/embed/tv/${currentMediaId}/${s}/${e}`;
    }

    function playCustomUrl(url, title) {
      document.getElementById('videoTitle').innerText = title;
      document.getElementById('seriesControls').style.display = 'none';
      document.getElementById('videoIframe').src = url;
      document.getElementById('playerModal').style.display = 'flex';
    }

    function closePlayer() {
      document.getElementById('playerModal').style.display = 'none';
      document.getElementById('videoIframe').src = '';
    }

    loadCategory('all');
  </script>
</body>
</html>
